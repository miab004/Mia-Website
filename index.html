<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="theme-color" content="#f6a6c8">
	<title>Pink Day</title>
	<style>
		:root {
			color-scheme: light;
			font-family: "Segoe UI", Arial, sans-serif;
			background: #f6a6c8;
			color: #52243b;
		}

		* { box-sizing: border-box; }

		body {
			min-height: 100vh;
			margin: 0;
			display: grid;
			place-items: center;
			padding: 2rem;
			background: linear-gradient(135deg, #ffd9e8 0%, #f6a6c8 52%, #ed83b2 100%);
		}

		main {
			width: min(100%, 680px);
			padding: clamp(2rem, 7vw, 4.5rem);
			text-align: center;
			background: rgb(255 255 255 / 72%);
			border: 1px solid rgb(255 255 255 / 80%);
			border-radius: 28px;
			box-shadow: 0 24px 70px rgb(110 35 72 / 16%);
			backdrop-filter: blur(10px);
		}

		.flower { font-size: 3rem; }

		h1 {
			margin: 0.6rem 0 1rem;
			font-size: clamp(2.5rem, 8vw, 4.5rem);
			line-height: 1;
			letter-spacing: -0.06em;
		}

		p {
			max-width: 38ch;
			margin: 0 auto 1.8rem;
			color: #77445d;
			font-size: 1.1rem;
			line-height: 1.7;
		}

		a {
			display: inline-block;
			padding: 0.85rem 1.35rem;
			border-radius: 999px;
			background: #a83d70;
			color: white;
			font-weight: 700;
			text-decoration: none;
			transition: transform 160ms ease, background 160ms ease;
		}

		a:hover { background: #87305a; transform: translateY(-2px); }
		a:focus-visible { outline: 3px solid #52243b; outline-offset: 4px; }
	</style>
</head>
<body>
	<main>
		<div class="flower" aria-hidden="true">🌸</div>
		<h1>Welcome!</h1>
		<p>Order your cake pops here!</p>
		<a href="mailto:happychocolatepops@gmail.com">Click to order</a>
	</main>
</body>
</html>
